# 公开仓库不自动发版。
# 发版由维护者在本机完成构建与 EXE 核验后，手动上传 Release。
# 需要时仅可手动触发本 workflow（默认仍为 noop）。
name: Release

on:
  workflow_dispatch:

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - name: Public release workflow disabled
        run: |
          echo "Automatic GitHub Release is intentionally disabled."
          echo "Use local compile + EXE verification, then publish assets manually if needed."
